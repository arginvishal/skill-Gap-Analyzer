<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Skill Gap Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="page-shell">
        <div class="login-card">
            <div class="cover-panel">
                <img src="./assests/coverimage.png" alt="Skill Gap Analyzer cover illustration">
            </div>

            <div class="form-panel">

                <h1>Login</h1>
                <p class="subtitle">Welcome back! Please log into your account.</p>

                <form class="login-form">
                    <div class="mb-3 form-group">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>

                    <div class="mb-3 form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password">
                    </div>

                    <div class="form-row">
                        <label class="checkbox-wrap">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="./forgotpassword.html" class="link">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn">Login</button>

                    <p class="signup-text">Don't have an account? <a href="./register.html">Create an account</a></p>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
