<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f6f5">
    <title>Create Account | Skill Gap Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body class="register-page">
    <main class="container register-shell">
        <section class="register-card" aria-labelledby="register-title">
            <aside class="register-visual" aria-label="Skill Gap Analyzer">
                <img src="./assests/coverimage.png" alt="Abstract illustration for Skill Gap Analyzer">
                <div class="register-visual-copy">
                    <p class="register-brand">SKILL GAP ANALYZER</p>
                    <h2>Make your next move count.</h2>
                    <p>Build a clear picture of your strengths and where you want to grow.</p>
                </div>
            </aside>

            <div class="register-form-panel">
                <header class="register-heading">
                    <p class="register-eyebrow">YOUR NEXT CHAPTER STARTS HERE</p>
                    <h1 id="register-title">Create your account</h1>
                    <p>Set up your profile to start exploring your skills.</p>
                </header>

                <form action="#" method="post" class="register-form">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="first-name" class="form-label">First name</label>
                            <input type="text" class="form-control" id="first-name" name="firstName"
                                placeholder="Jamie" autocomplete="given-name" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="last-name" class="form-label">Last name</label>
                            <input type="text" class="form-control" id="last-name" name="lastName"
                                placeholder="Morgan" autocomplete="family-name" required>
                        </div>
                        <div class="col-12">
                            <label for="register-email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="register-email" name="email"
                                placeholder="you@example.com" autocomplete="email" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="register-password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="register-password" name="password"
                                placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="confirm-password" class="form-label">Confirm password</label>
                            <input type="password" class="form-control" id="confirm-password" name="confirmPassword"
                                placeholder="Re-enter password" autocomplete="new-password" minlength="8" required>
                        </div>
                        <div class="col-12">
                            <div class="form-check register-consent">
                                <input class="form-check-input" type="checkbox" value="accepted" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
                                </label>
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn register-submit">Create account</button>
                        </div>
                    </div>
                </form>

                <p class="register-login">Already have an account? <a href="./login.html">Log in</a></p>
            </div>
        </section>
    </main>
</body>

</html>
