<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f6f5">
    <title>Reset Password | Skill Gap Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body class="forgot">
    <main class="forgot-box" aria-labelledby="forgot-title">
        <p class="forgot-eyebrow">ACCOUNT RECOVERY</p>
        <h1 id="forgot-title">Reset your password</h1>
        <p class="forgot-intro">Enter your email and verification code to continue.</p>

        <form action="#" method="post" class="forgot-form">
            <div class="mb-3">
                <label for="recovery-email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="recovery-email" name="email"
                    placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="mb-4">
                <label for="verification-code" class="form-label">Verification code</label>
                <input type="text" class="form-control" id="verification-code" name="code"
                    placeholder="Enter your 6-digit code" inputmode="numeric" autocomplete="one-time-code"
                    maxlength="6" pattern="[0-9]{6}" aria-describedby="code-help" required>
                <div id="code-help" class="form-text">Use the code sent to your email address.</div>
            </div>
            <button type="submit" class="btn forgot-submit">Verify code</button>
        </form>

        <p class="forgot-login">Remembered your password? <a href="./login.html">Back to log in</a></p>
        <p class="forgot-register">New to Skill Gap Analyzer? <a href="./register.html">Create an account</a></p>
    </main>
</body>

</html>
